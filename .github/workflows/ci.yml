name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Bench smoke
        run: vision-pipe bench --input ../examples/images --repeat 5 --warmup 1

  core-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + api deps
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install -r api/requirements.txt
      - name: Test core + api
        run: pytest tests api/tests -q
      - name: Import smoke
        run: python -c "from vision_pipe.pipeline import infer_image; print(infer_image)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

